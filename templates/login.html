{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-card">

    <div class="card">

        <div class="card-header bg-primary text-white text-center">

            <h3>Login</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-primary w-100">

                    Login

                </button>

            </form>

            <hr>

            <p class="text-center">

                Don't have an account?

                <a href="/signup">
                    Signup
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
