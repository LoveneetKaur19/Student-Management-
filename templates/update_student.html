{% extends "base.html" %}

{% block title %}
Update Student
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Update Student
            </h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Roll Number</label>

                        <input
                            type="text"
                            name="roll_number"
                            class="form-control"
                            value="{{ student.roll_number }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Student Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student.name }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Branch</label>

                        <input
                            type="text"
                            name="branch"
                            class="form-control"
                            value="{{ student.branch }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Semester</label>

                        <input
                            type="text"
                            name="semester"
                            class="form-control"
                            value="{{ student.semester }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Phone</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student.phone }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email }}">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Marks</label>

                        <input
                            type="number"
                            step="0.01"
                            name="marks"
                            class="form-control"
                            value="{{ student.marks }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Attendance (%)</label>

                        <input
                            type="number"
                            step="0.01"
                            name="attendance"
                            class="form-control"
                            value="{{ student.attendance }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Status</label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Active"
                            {% if student.status=="Active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="Inactive"
                            {% if student.status=="Inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <h5>Fee Details</h5>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Total Fee</label>

                        <input
                            type="number"
                            step="0.01"
                            name="total_fee"
                            class="form-control"
                            value="{{ student.total_fee }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Paid Fee</label>

                        <input
                            type="number"
                            step="0.01"
                            name="paid_fee"
                            class="form-control"
                            value="{{ student.paid_fee }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Student Photo</label>

                        <input
                            type="file"
                            name="photo"
                            class="form-control">

                    </div>

                </div>

                {% if student.photo %}

                <div class="mb-3">

                    <img
                        src="{{ url_for('static', filename='uploads/' + student.photo) }}"
                        width="120"
                        class="img-thumbnail">

                </div>

                {% endif %}

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Update Student

                </button>

                <a
                    href="/view_students"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
