{% extends "base.html" %}

{% block title %}
Add Attendance
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-calendar-check"></i>

                Add Attendance

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Student
                    </label>

                    <select
                        name="student_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">
                            {{ student.roll_number }} - {{ student.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <select
                        name="subject_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                        <option value="{{ subject.id }}">
                            {{ subject.subject_code }} - {{ subject.subject_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Attendance Date
                    </label>

                    <input
                        type="date"
                        name="attendance_date"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required>

                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>

                    </select>

                </div>

                <button class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Attendance

                </button>

                <a href="/view_attendance"
                   class="btn btn-secondary">

                    View Attendance

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
