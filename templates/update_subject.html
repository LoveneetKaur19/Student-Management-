{% extends "base.html" %}

{% block title %}
Update Subject
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Update Subject

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Subject Name

                    </label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        value="{{ subject.subject_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Subject Code

                    </label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        value="{{ subject.subject_code }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Credits

                    </label>

                    <input
                        type="number"
                        name="credits"
                        class="form-control"
                        min="1"
                        max="10"
                        value="{{ subject.credits }}"
                        required>

                </div>

                <button class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Update Subject

                </button>

                <a href="/view_subjects"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
