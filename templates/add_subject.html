{% extends "base.html" %}

{% block title %}
Add Subject
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="bi bi-book-fill"></i>
                Add Subject
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Subject Code
                    </label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Credits
                    </label>

                    <input
                        type="number"
                        name="credits"
                        class="form-control"
                        min="1"
                        max="10"
                        required>

                </div>

                <button class="btn btn-success">
                    Save Subject
                </button>

                <a href="/view_subjects"
                   class="btn btn-secondary">

                    View Subjects

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
