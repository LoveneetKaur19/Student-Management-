{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                <i class="bi bi-person-plus-fill"></i>
                Add Student
            </h3>

        </div>

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            name="roll_number"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Branch
                        </label>

                        <select
                            name="branch"
                            class="form-select"
                            required>

                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>Mechanical</option>
                            <option>Civil</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Semester
                        </label>

                        <select
                            name="semester"
                            class="form-select"
                            required>

                            {% for i in range(1,9) %}

                            <option>
                                Semester {{ i }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Marks
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="marks"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Attendance %
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="attendance"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Total Fee
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="total_fee"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Paid Fee
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="paid_fee"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Student Photo
                        </label>

                        <input
                            type="file"
                            name="photo"
                            class="form-control">

                    </div>

                </div>

                <div class="text-center mt-4">

                    <button
                        class="btn btn-success btn-lg">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Student

                    </button>

                    <a href="/view_students"
                       class="btn btn-secondary btn-lg">

                        <i class="bi bi-eye-fill"></i>

                        View Students

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
