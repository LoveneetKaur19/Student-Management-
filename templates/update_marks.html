{% extends "base.html" %}

{% block title %}Update Marks{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>

<i class="bi bi-pencil-square"></i>

Update Marks

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">Student</label>

<select name="student_id" class="form-select" required>

{% for student in students %}

<option value="{{ student.id }}"
{% if student.id == mark.student_id %}selected{% endif %}>

{{ student.roll_number }} - {{ student.name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Subject</label>

<select name="subject_id" class="form-select" required>

{% for subject in subjects %}

<option value="{{ subject.id }}"
{% if subject.id == mark.subject_id %}selected{% endif %}>

{{ subject.subject_code }} - {{ subject.subject_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Internal Marks

</label>

<input
type="number"
name="internal_marks"
class="form-control"
min="0"
max="30"
step="0.5"
value="{{ mark.internal_marks }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

External Marks

</label>

<input
type="number"
name="external_marks"
class="form-control"
min="0"
max="70"
step="0.5"
value="{{ mark.external_marks }}"
required>

</div>

<button class="btn btn-primary">

Update Marks

</button>

<a href="/view_marks"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

{% endblock %}
