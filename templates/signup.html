{% extends "base.html" %}

{% block title %}
Signup
{% endblock %}

{% block content %}

<div class="auth-card">

    <div class="card">

        <div class="card-header bg-success text-white text-center">

            <h3>Create Account</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-success w-100">

                    Create Account

                </button>

            </form>

            <hr>

            <p class="text-center">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
