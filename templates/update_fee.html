{% extends "base.html" %}

{% block title %}
Update Fee
{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>

<i class="bi bi-pencil-square"></i>

Update Fee Payment

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Student

</label>

<select
name="student_id"
class="form-select"
required>

{% for student in students %}

<option
value="{{ student.id }}"
{% if student.id==payment.student_id %}
selected
{% endif %}>

{{ student.roll_number }}

-

{{ student.name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Amount

</label>

<input
type="number"
name="amount"
class="form-control"
value="{{ payment.amount }}"
step="0.01"
required>

</div>

<div class="mb-3">

<label class="form-label">

Payment Mode

</label>

<select
name="payment_mode"
class="form-select">

<option value="Cash"
{% if payment.payment_mode=="Cash" %}
selected
{% endif %}>
Cash
</option>

<option value="UPI"
{% if payment.payment_mode=="UPI" %}
selected
{% endif %}>
UPI
</option>

<option value="Card"
{% if payment.payment_mode=="Card" %}
selected
{% endif %}>
Card
</option>

<option value="Net Banking"
{% if payment.payment_mode=="Net Banking" %}
selected
{% endif %}>
Net Banking
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Receipt Number

</label>

<input
type="text"
name="receipt_number"
class="form-control"
value="{{ payment.receipt_number }}"
required>

</div>

<button class="btn btn-primary">

Update Fee

</button>

<a href="/fee_history"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

{% endblock %}
