{% extends "base.html" %}

{% block title %}
Add Assignment
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-file-earmark-plus"></i>

                Add Assignment

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <select
                        name="subject_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                        <option value="{{ subject.id }}">

                            {{ subject.subject_code }}
                            -
                            {{ subject.subject_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Due Date
                    </label>

                    <input
                        type="date"
                        name="due_date"
                        class="form-control"
                        required>

                </div>

                <button class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Assignment

                </button>

                <a href="/view_assignment"
                   class="btn btn-secondary">

                    View Assignments

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
