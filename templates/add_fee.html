{% extends "base.html" %}

{% block title %}
Add Fee
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-cash-stack"></i>

                Add Fee Payment

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Student
                    </label>

                    <select
                        name="student_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">

                            {{ student.roll_number }} -
                            {{ student.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        name="amount"
                        class="form-control"
                        min="1"
                        step="0.01"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Payment Mode
                    </label>

                    <select
                        name="payment_mode"
                        class="form-select"
                        required>

                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Card</option>
                        <option value="Net Banking">Net Banking</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Receipt Number
                    </label>

                    <input
                        type="text"
                        name="receipt_number"
                        class="form-control"
                        required>

                </div>

                <button class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Save Payment

                </button>

                <a href="/fee_history"
                   class="btn btn-secondary">

                    View Fee History

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
